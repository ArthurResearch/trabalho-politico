<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contato</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
    <header>

        <nav class="navbar">

            <a href="index.html" class="logo">
                <img src="imagens/partido.png" alt="Logo da campanha">
            </a>

            <ul class="menu">

                <li><a href="index.html">Início</a></li>
                <li><a href="historia.html">História</a></li>
                <li><a href="propostas.html">Propostas</a></li>
                <li><a href="agenda.html">Agenda</a></li>
                <li><a href="fotos.html">Fotos</a></li>
                <li><a href="jingle.html">Jingle</a></li>
                <li><a href="contato.html">Contato</a></li>

            </ul>

        </nav>

    </header>

    <main>
        
        <form>
            <div class="form-group">
                <label for="nome">Nome:</label>
                <input type="text" name="nome" required placeholder="Seu nome completo">
            </div>

            <div class="form-group">
                <label for="email">E-mail:</label>
                <input type="email" name="email" required placeholder="seu.email@exemplo.com">
            </div>

            <div class="form-group">
                <label for="assunto">Assunto:</label>
                <input type="text" name="assunto" required placeholder="Motivo do contato">
            </div>

            <div class="form-group">
                <label for="mensagem">Mensagem:</label>
                <textarea name="mensagem" rows="5" required placeholder="Digite sua mensagem aqui..."></textarea>
            </div>

            <button type="submit">Enviar Mensagem</button>
        </form>

    </main>

    <footer>

    </footer>

</body>
</html>
